services:
  tv-apk-sync:
    image: lzylipu/tv-apk-sync:latest
    container_name: tv-apk-sync
    restart: unless-stopped
    ports:
      - "8088:8080"
    environment:
      TZ: Asia/Shanghai
    volumes:
      - ./data:/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
